GitHub's mobile editor frequently truncates very long pastes (~850 lines) on
iPhone!

To fix that for good, here is a much shorter, compact version of the exact same
game (less than half the lines, with all 24 puzzles, Wikipedia photos/facts,
Read Aloud, Scrapbook, Hints, and Clues intact—plus a fix so 💡 Hint (10⭐) stays
on one line and an on-screen error detector just in case).

Quick Steps (Takes 1 Minute)

1.  In Safari on your iPhone, open index.html in your GitHub repo → tap Edit
    (pencil).
2.  Select All → Delete so the box is empty.
3.  Copy & Paste the shorter code below.
4.  Scroll to the bottom and confirm you see </html> as the very last line, then
    tap Commit changes.
5.  Wait ~1 minute and refresh stupidwopdego.github.io.

const BONUS = new Set("ACT,AGE,AIR,ALL,ANT,ANY,APT,ARE,ARM,ART,ATE,AUNT,CAN,CAR,CAT,CHAT,COAT,CON,COOL,COST,CYAN,DART,DEAL,DIP,DRY,EACH,EAR,EAT,ERA,EVEN,FAIR,FEAR,FIRE,FOAM,GAIN,GALE,GALL,GAZE,GEAR,GOAL,GRAIN,GUN,HARP,HATE,HEAT,HIND,HIP,HOLD,ICE,INN,KING,LACE,LAND,LAP,LAPS,LAST,LATE,LAW,LAY,LAWN,LEAD,LEAF,LEAST,LINE,LION,LIP,LOAF,LOAN,LOG,LOOP,MAN,MAP,MAT,MIME,MOAN,MOP,NINE,NOD,OAR,OIL,OLD,OVAL,PAID,PAIR,PAL,PAR,PART,PAST,PAT,PATS,PAY,PEN,PIE,PIN,PINE,PING,PIPE,PLAN,PLAY,PLOD,PLUS,POEM,POLL,POND,POOL,POPE,POST,PRAY,PRO,PUN,RACE,RAGE,RAIN,RAN,RANG,RANT,RAP,RAT,RATS,RAW,REAL,REST,RICE,RING,ROAR,SALT,SAP,SAT,SCAR,SEA,SET,SIGN,SING,SINK,SKIN,SLAP,SLAY,SOUP,SPIN,SPOT,SPY,STAR,STAY,STOP,TAP,TAPS,TAR,TEA,TEAR,TIE,TIN,TINT,TON,TOP,TRAP,TREE,TURN,VAN,VEIN,VEST,VINE,WAR,WARN,WAY,WIN,YARD,YES,YET,YON,YOU,ZAP".split(","));

const getLS = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } };
const getScrap = () => { try { const a = JSON.parse(localStorage.getItem("ww_scrapbook") || "[]"); return Array.isArray(a) ? a : []; } catch { return []; } };

const state = {
  stars: Number(getLS("ww_stars", "60")) || 60,
  sound: getLS("ww_sound", "true") !== "false",
  scrap: getScrap(),
  deck: [], p: PUZZLES[0], letters: [], sel: [], solved: new Set(), bonus: new Set(), hints: {},
  mainClue: false, slotClue: null, filter: "All"
};

let ctx = null, pDown = false, dragging = false, firstNode = null, wasLast = false, dragPt = null, bTimer = null;
const $ = id => document.getElementById(id);

function save() {
  try {
    localStorage.setItem("ww_stars", String(state.stars));
    localStorage.setItem("ww_sound", String(state.sound));
    localStorage.setItem("ww_scrapbook", JSON.stringify(state.scrap));
  } catch {}
  $("starsCount").textContent = state.stars;
  $("scrapCount").textContent = state.scrap.length;
  $("soundBtn").textContent = state.sound ? "🔊" : "🔇";
}

function tone(freq, dur = .09, vol = .12) {
  if (!state.sound) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!ctx) ctx = new AC();
    if (ctx.state === "suspended") ctx.resume();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + dur);
  } catch {}
}

function chime(major) {
  (major ? [523,659,784,1046] : [659,880]).forEach((f, i) => setTimeout(() => tone(f, .22, .11), i * 55));
}

function shuf(a) {
  const r = a.slice();
  for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; }
  return r;
}

function nextPuzzle() {
  stopSpeech(); closeModals();
  if (!state.deck.length) state.deck = shuf(PUZZLES.map(p => p.id).filter(id => id !== state.p.id));
  const id = state.deck.shift();
  state.p = PUZZLES.find(x => x.id === id) || PUZZLES[0];
  state.letters = shuf(state.p.w.split(""));
  if (state.letters.join("") === state.p.w) state.letters = shuf(state.letters);
  state.sel = []; state.solved = new Set(); state.bonus = new Set(); state.hints = {};
  state.mainClue = false; state.slotClue = null;
  const t = CATS[state.p.c];
  document.documentElement.style.setProperty("--accent", t.c);
  document.documentElement.style.setProperty("--soft", t.s);
  $("catBadge").textContent = t.e + " " + state.p.c;
  $("clueBtn").textContent = "❓ Clue";
  renderAll();
}

function renderAll() {
  save(); renderClue(); renderBoard(); renderStatus(); renderWheel();
  const done = state.solved.has(state.p.w);
  $("viewFactBtn").style.display = done ? "inline-flex" : "none";
  $("skipBtn").style.display = done ? "none" : "inline-flex";
}

function renderClue() {
  const box = $("clueBox");
  if (state.slotClue) {
    $("clueTitle").textContent = "Word Clue (" + state.slotClue.w.length + " letters)";
    $("clueText").textContent = state.slotClue.q;
    box.classList.add("visible");
  } else if (state.mainClue) {
    $("clueTitle").textContent = "Topic Clue";
    $("clueText").textContent = state.p.q;
    box.classList.add("visible");
  } else box.classList.remove("visible");
}

function makeTiles(word) {
  const row = document.createElement("div"); row.className = "tiles-row";
  const ok = state.solved.has(word), h = state.hints[word] || new Set();
  for (let i = 0; i < word.length; i++) {
    const t = document.createElement("div");
    t.className = "tile" + (ok ? " solved" : "");
    t.textContent = (ok || h.has(i)) ? word[i] : "";
    row.appendChild(t);
  }
  return row;
}

function renderBoard() {
  const b = $("board"), p = state.p, ok = state.solved.has(p.w);
  b.innerHTML = "";
  const fc = document.createElement("div");
  fc.className = "featured-card" + (p.w.length >= 8 ? " long" : "");
  const lbl = document.createElement("div"); lbl.className = "featured-label";
  lbl.textContent = ok ? "✨ Discovery Unlocked — Tap for Photo & Facts" : "🔍 Featured Mystery Word";
  fc.append(lbl, makeTiles(p.w));
  fc.onclick = () => ok ? openDiscovery() : toggleSlot(p.w, p.q);
  b.appendChild(fc);

  const g = document.createElement("div"); g.className = "subgrid";
  p.b.forEach(([w, q]) => {
    const card = document.createElement("div");
    card.className = "word-card" + (state.slotClue && state.slotClue.w === w ? " active-clue" : "");
    card.appendChild(makeTiles(w));
    card.onclick = () => { if (!state.solved.has(w)) toggleSlot(w, q); };
    g.appendChild(card);
  });
  b.appendChild(g);
}

function toggleSlot(w, q) {
  state.slotClue = (state.slotClue && state.slotClue.w === w) ? null : { w, q };
  tone(587, .06, .08); renderClue(); renderBoard();
}

function renderStatus(msg = null, warn = false) {
  const s = $("statusStrip"); s.innerHTML = "";
  if (msg) {
    const p = document.createElement("div"); p.className = "banner-pill" + (warn ? " warn" : "");
    p.textContent = msg; s.appendChild(p); return;
  }
  const w = state.sel.map(i => state.letters[i]).join("");
  if (w) {
    const pill = document.createElement("div"); pill.className = "preview-pill";
    const clr = document.createElement("button"); clr.className = "mini-btn mini-clear"; clr.textContent = "✕";
    clr.onclick = () => { state.sel = []; renderStatus(); renderWheel(); };
    const txt = document.createElement("span"); txt.className = "preview-letters"; txt.textContent = w;
    const chk = document.createElement("button"); chk.className = "mini-btn mini-check"; chk.textContent = "Check";
    chk.onclick = submitWord;
    pill.append(clr, txt, chk); s.appendChild(pill);
  } else {
    s.innerHTML = '<div class="hint-text">Swipe or tap letters • Tap any row for a clue</div>';
  }
}

function banner(m, warn = false) {
  clearTimeout(bTimer); renderStatus(m, warn);
  bTimer = setTimeout(() => renderStatus(), 2100);
}

function centers() {
  return state.letters.map((_, i) => {
    const a = (2 * Math.PI / state.letters.length) * i - Math.PI / 2;
    return { x: 121 + Math.cos(a) * 84, y: 121 + Math.sin(a) * 84 };
  });
}

function renderWheel() {
  const w = $("wheel"), svg = $("wheelSvg"), cts = centers();
  w.querySelectorAll(".letter-node").forEach(n => n.remove());
  state.letters.forEach((ch, i) => {
    const n = document.createElement("div");
    n.className = "letter-node" + (state.sel.includes(i) ? " selected" : "");
    n.textContent = ch; n.style.left = cts[i].x + "px"; n.style.top = cts[i].y + "px";
    w.appendChild(n);
  });
  svg.innerHTML = "";
  if (state.sel.length) {
    const pts = state.sel.map(i => cts[i].x + "," + cts[i].y);
    if (dragPt && dragging) pts.push(dragPt.x + "," + dragPt.y);
    const poly = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
    poly.setAttribute("points", pts.join(" ")); poly.setAttribute("fill", "none");
    poly.setAttribute("stroke", CATS[state.p.c].c); poly.setAttribute("stroke-width", "9");
    poly.setAttribute("stroke-linecap", "round"); poly.setAttribute("stroke-linejoin", "round");
    svg.appendChild(poly);
  }
}

function hitWheel(cx, cy) {
  const r = $("wheel").getBoundingClientRect(), x = cx - r.left, y = cy - r.top;
  dragPt = { x, y };
  const cts = centers();
  for (let i = 0; i < cts.length; i++) if (Math.hypot(x - cts[i].x, y - cts[i].y) <= 32) return i;
  return null;
}

const wheelEl = $("wheel");
wheelEl.addEventListener("pointerdown", e => {
  if (e.target.closest("#shuffleBtn")) return;
  e.preventDefault();
  try { wheelEl.setPointerCapture(e.pointerId); } catch {}
  pDown = true; dragging = false; firstNode = null; wasLast = false;
  const hit = hitWheel(e.clientX, e.clientY);
  if (hit !== null) {
    firstNode = hit;
    wasLast = state.sel.length && state.sel[state.sel.length - 1] === hit;
    if (!state.sel.includes(hit)) {
      state.sel.push(hit);
      tone([523,587,659,698,784,880,988,1046][state.sel.length % 8]);
      renderWheel(); renderStatus();
    }
  }
});

wheelEl.addEventListener("pointermove", e => {
  if (!pDown) return;
  const hit = hitWheel(e.clientX, e.clientY);
  if (hit !== null) {
    if (firstNode === null) firstNode = hit;
    else if (hit !== firstNode) dragging = true;
    if (dragging && state.sel.length >= 2 && hit === state.sel[state.sel.length - 2]) {
      state.sel.pop(); tone(440);
    } else if (!state.sel.includes(hit)) {
      state.sel.push(hit);
      tone([523,587,659,698,784,880,988,1046][state.sel.length % 8]);
    }
  }
  renderWheel(); renderStatus();
});

function endPtr() {
  if (!pDown) return;
  pDown = false; dragPt = null;
  if (dragging) { dragging = false; submitWord(); }
  else { if (wasLast && state.sel.length) state.sel.pop(); renderWheel(); renderStatus(); }
  firstNode = null; wasLast = false;
}
wheelEl.addEventListener("pointerup", endPtr);
wheelEl.addEventListener("pointercancel", endPtr);

function submitWord() {
  const w = state.sel.map(i => state.letters[i]).join("");
  state.sel = []; renderWheel();
  if (w.length < 3) { if (w) { tone(230, .13); banner("Use at least 3 letters", true); } else renderStatus(); return; }
  if (state.solved.has(w) || state.bonus.has(w)) { tone(250, .12); banner("Already found " + w + "!", true); return; }
  const p = state.p;
  if (w === p.w || p.b.some(x => x[0] === w)) {
    state.solved.add(w);
    if (state.slotClue && state.slotClue.w === w) state.slotClue = null;
    const isF = w === p.w, pts = isF ? 15 : 5;
    state.stars += pts;
    const all = state.solved.has(p.w) && p.b.every(x => state.solved.has(x[0]));
    if (all) state.stars += 10;
    chime(isF || all); renderAll();
    banner(isF ? "Discovered " + w + "! +" + pts + "⭐" : "Great! " + w + " +" + pts + "⭐");
    if (isF || all) confetti();
    if (isF) openDiscovery();
    return;
  }
  if (BONUS.has(w)) { state.bonus.add(w); state.stars += 3; chime(false); save(); banner("Bonus Word: " + w + "! +3⭐"); return; }
  tone(220, .14); banner("Not in word list", true);
}

function confetti() {
  const cols = [CATS[state.p.c].c, "#f59e0b", "#ec4899", "#06b6d4"];
  for (let i = 0; i < 18; i++) {
    const d = document.createElement("div"); d.className = "confetti";
    d.style.left = (15 + Math.random() * 70) + "vw"; d.style.top = (20 + Math.random() * 25) + "vh";
    d.style.background = cols[i % 4]; document.body.appendChild(d);
    setTimeout(() => d.remove(), 1300);
  }
}

$("shuffleBtn").onclick = () => { state.sel = []; state.letters = shuf(state.letters); tone(587, .07); renderWheel(); renderStatus(); };
$("clueBtn").onclick = () => { state.slotClue = null; state.mainClue = !state.mainClue; $("clueBtn").textContent = state.mainClue ? "❓ Hide Clue" : "❓ Clue"; tone(523, .06); renderClue(); };
$("hintBtn").onclick = () => {
  const p = state.p, w = [p.w, ...p.b.map(x => x[0])].find(x => !state.solved.has(x));
  if (!w) return banner("All words solved!");
  if (state.stars < 10) { state.stars += 30; save(); return banner("Gift Refill: +30⭐ added!"); }
  if (!state.hints[w]) state.hints[w] = new Set();
  const left = []; for (let i = 0; i < w.length; i++) if (!state.hints[w].has(i)) left.push(i);
  if (left.length) {
    state.stars -= 10; state.hints[w].add(left[Math.floor(Math.random() * left.length)]); tone(784, .1);
    if (state.hints[w].size === w.length) { state.solved.add(w); if (w === p.w) openDiscovery(); }
    renderAll();
  }
};
$("nextBtn").onclick = nextPuzzle;
$("skipBtn").onclick = nextPuzzle;
$("viewFactBtn").onclick = () => openDiscovery();
$("soundBtn").onclick = () => { state.sound = !state.sound; save(); };

async function fetchFact(p) {
  const ex = state.scrap.find(x => x.id === p.id);
  if (ex && ex.img) return ex;
  let d = null;
  try {
    const r = await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(p.k.replace(/ /g, "_")));
    if (r.ok) d = await r.json();
  } catch {}
  const item = {
    id: p.id, c: p.c, w: p.w, title: (d && d.title) || p.k,
    sub: (d && d.description) || p.c, sum: (d && d.extract) || p.s, facts: p.f,
    img: (d && ((d.originalimage && d.originalimage.source) || (d.thumbnail && d.thumbnail.source))) || null,
    url: (d && d.content_urls && d.content_urls.desktop && d.content_urls.desktop.page) || null
  };
  const i = state.scrap.findIndex(x => x.id === item.id);
  if (i >= 0) state.scrap[i] = item; else state.scrap.unshift(item);
  save(); return item;
}

async function openDiscovery(custom = null) {
  stopSpeech();
  const body = $("discoveryBody"), p = state.p;
  const all = p && state.solved.has(p.w) && p.b.every(x => state.solved.has(x[0]));
  $("finishWordsBtn").style.display = (custom || all) ? "none" : "block";
  $("modalNextBtn").textContent = custom ? "Close" : "Next Topic →";
  $("discoveryModal").classList.add("open");
  body.innerHTML = '<p style="text-align:center;padding:40px 0;color:var(--muted);">Loading picture &amp; facts...</p>';

  const item = custom || await fetchFact(p);
  $("modalCatLabel").textContent = CATS[item.c].e + " " + item.c;
  body.innerHTML = "";
  const h2 = document.createElement("h2"); h2.style.cssText = "margin:0 0 4px;font-size:28px;"; h2.textContent = item.title;
  const sub = document.createElement("div"); sub.style.cssText = "color:var(--muted);font-size:15px;text-transform:capitalize;margin-bottom:8px;"; sub.textContent = item.sub;
  body.append(h2, sub);
  if (item.img) { const img = document.createElement("img"); img.className = "discovery-img"; img.src = item.img; img.alt = item.title; body.appendChild(img); }
  const sp = document.createElement("button"); sp.className = "speak-btn"; sp.textContent = "🔊 Read Facts Aloud";
  sp.onclick = () => toggleSpeech(item.title + ". " + item.sum + " Did you know? " + item.facts.join(" "), sp);
  const sum = document.createElement("p"); sum.style.cssText = "font-size:17px;line-height:1.5;margin:0 0 14px;"; sum.textContent = item.sum;
  const box = document.createElement("div"); box.className = "facts-box";
  box.innerHTML = "<h4>💡 Did You Know?</h4>";
  const ul = document.createElement("ul"); item.facts.forEach(f => { const li = document.createElement("li"); li.textContent = f; ul.appendChild(li); });
  box.appendChild(ul);
  body.append(sp, sum, box);
  if (item.url) { const a = document.createElement("a"); a.href = item.url; a.target = "_blank"; a.rel = "noopener"; a.style.cssText = "color:var(--accent);font-weight:700;font-size:15px;"; a.textContent = "Read full Wikipedia article ↗"; body.appendChild(a); }
}

function toggleSpeech(txt, btn) {
  if (!("speechSynthesis" in window)) return;
  if (window.speechSynthesis.speaking) { stopSpeech(); btn.textContent = "🔊 Read Facts Aloud"; return; }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(txt); u.rate = .92;
  u.onend = u.onerror = () => { btn.textContent = "🔊 Read Facts Aloud"; };
  btn.textContent = "⏹ Stop Reading"; window.speechSynthesis.speak(u);
}

function stopSpeech() { try { if ("speechSynthesis" in window) window.speechSynthesis.cancel(); } catch {} }
function closeModals() { stopSpeech(); $("discoveryModal").classList.remove("open"); $("scrapbookModal").classList.remove("open"); }

$("closeDiscoveryBtn").onclick = closeModals;
$("finishWordsBtn").onclick = closeModals;
$("modalNextBtn").onclick = () => $("modalNextBtn").textContent === "Close" ? closeModals() : nextPuzzle();
$("scrapbookBtn").onclick = () => { renderScrap(); $("scrapbookModal").classList.add("open"); };
$("closeScrapbookBtn").onclick = closeModals;

function renderScrap() {
  const f = $("scrapFilters"), l = $("scrapList");
  f.innerHTML = "";
  ["All","Animals","Geography","History"].forEach(c => {
    const cnt = c === "All" ? state.scrap.length : state.scrap.filter(x => x.c === c).length;
    const b = document.createElement("button"); b.className = "filter-chip" + (state.filter === c ? " active" : "");
    b.textContent = c + " (" + cnt + ")"; b.onclick = () => { state.filter = c; renderScrap(); };
    f.appendChild(b);
  });
  const items = state.filter === "All" ? state.scrap : state.scrap.filter(x => x.c === state.filter);
  l.innerHTML = "";
  if (!items.length) { l.innerHTML = '<p style="text-align:center;color:var(--muted);padding:32px 12px;">Solve featured words to collect photos and facts here!</p>'; return; }
  items.forEach(it => {
    const row = document.createElement("div"); row.className = "scrap-item";
    if (it.img) { const i = document.createElement("img"); i.className = "scrap-thumb"; i.src = it.img; row.appendChild(i); }
    else { const d = document.createElement("div"); d.className = "scrap-thumb"; d.textContent = CATS[it.c].e; row.appendChild(d); }
    const inf = document.createElement("div");
    inf.innerHTML = `<div style="font-weight:800;font-size:17px;">${it.title}</div><div style="font-size:13px;font-weight:700;color:${CATS[it.c].c};">${it.c}</div><div style="font-size:13px;color:var(--muted);margin-top:2px;">${it.sum.slice(0,70)}...</div>`;
    row.appendChild(inf);
    row.onclick = () => { $("scrapbookModal").classList.remove("open"); openDiscovery(it); };
    l.appendChild(row);
  });
}

nextPuzzle();
</script>
</body>
</html>
