<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="WonderWheel" />
  <meta name="theme-color" content="#f6f3ec" />
  <title>WonderWheel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app">
  <div class="topbar">
    <button class="pill" id="scrapbookBtn" aria-label="Open scrapbook">📖 <span id="scrapCount">0</span></button>
    <div class="pill" aria-label="Stars">⭐ <span id="starsCount">60</span></div>
    <button class="pill" id="soundBtn" aria-label="Sound on or off">🔊</button>
  </div>

  <div class="progress" aria-live="polite">
    <div class="progress-text" id="progressText">Discovered 0 of 0</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div class="cat-row">
    <div class="cat-badge" id="catBadge">🐾 Animals</div>
    <button class="fact-chip" id="viewFactBtn" hidden>🖼️ Photo &amp; Facts</button>
    <button class="skip-btn" id="skipBtn">Skip ↷</button>
  </div>

  <div class="clue-box" id="clueBox"><div class="clue-title" id="clueTitle"></div><div id="clueText"></div></div>
  <div class="board" id="board"></div>
  <div class="status-strip" id="statusStrip"></div>

  <div class="wheel-wrap">
    <div class="wheel" id="wheel">
      <svg class="wheel-svg" id="wheelSvg"></svg>
      <button class="wheel-center" id="shuffleBtn" type="button" aria-label="Mix letters">🔀<span>Mix</span></button>
    </div>
  </div>

  <div class="actions">
    <button class="action-btn btn-clue" id="clueBtn">❓ Clue</button>
    <button class="action-btn btn-hint" id="hintBtn">💡 Hint <small>10⭐</small></button>
    <button class="action-btn btn-next" id="nextBtn">✨ New Topic</button>
  </div>
</div>

<div class="modal-backdrop" id="discoveryModal">
  <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="modalCatLabel">
    <div class="modal-header"><strong id="modalCatLabel">Discovery</strong><button class="mini-btn mini-clear" id="closeDiscoveryBtn">Done</button></div>
    <div class="modal-body" id="discoveryBody"></div>
    <div class="modal-footer"><button class="btn-sec btn-more" id="moreCatBtn">More</button><button class="btn-sec" id="finishWordsBtn">Finish Words</button><button class="btn-pri" id="modalNextBtn">Next Topic →</button></div>
  </div>
</div>

<div class="modal-backdrop" id="scrapbookModal">
  <div class="modal-sheet" role="dialog" aria-modal="true" aria-label="My Scrapbook">
    <div class="modal-header"><strong>📖 My Scrapbook</strong><button class="mini-btn mini-clear" id="closeScrapbookBtn">Close</button></div>
    <div class="modal-body"><div class="filter-row" id="scrapFilters"></div><div id="scrapList"></div></div>
  </div>
</div>

<script>
// Show any startup error on screen instead of a blank page.
window.onerror = function (msg, src, line) {
  var b = document.getElementById("board");
  if (!b) return;
  var d = document.createElement("div");
  d.className = "error-box";
  d.textContent = "Something went wrong (line " + line + "): " + msg;
  b.textContent = "";
  b.appendChild(d);
};
</script>
<script src="js/data.js"></script>
<script src="js/words.js"></script>
<script src="js/logic.js"></script>
<script src="js/game.js"></script>
</body>
</html>
